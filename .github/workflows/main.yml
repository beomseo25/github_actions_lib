name: Java CI with Docker Hub

on:
  push:
    branches: [ "main" ]

jobs:
  # ----------------------------------------------------
  # [Job 1] 품질 검사대 (Test)
  # ----------------------------------------------------
  test:
    runs-on: ubuntu-latest
    
    # 깃허브 가상 컴퓨터에 띄울 테스트용 DB 세팅
    services:
      mariadb:
        image: mariadb:latest
        env:
          MYSQL_ROOT_PASSWORD: root      # 최고 관리자 비밀번호
          MYSQL_DATABASE: library        # 자동 생성할 데이터베이스 이름
          MYSQL_USER: cjulib             # 자바 코드에 적힌 진짜 DB 아이디
          MYSQL_PASSWORD: security       # 자바 코드에 적힌 진짜 DB 비밀번호
        ports:
          - 3306:3306
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Run Tests
      working-directory: ./LibraryManagement_v1.2
      run: |
        chmod +x gradlew
        ./gradlew test

  # ----------------------------------------------------
  # [Job 2] 포장 공장 (Build)
  # ----------------------------------------------------
  build:
    needs: test # 앞선 test가 성공해야만 실행됨!
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Build with Gradle
      working-directory: ./LibraryManagement_v1.2
      run: |
        chmod +x gradlew
        ./gradlew clean build -x test
        
    # 바톤 넘기기 (.jar 파일을 깃허브 서버에 임시 업로드)
    - name: Upload JAR artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-jar
        path: ./LibraryManagement_v1.2/build/libs/*.jar
        retention-days: 1 # 하루 지나면 자동 삭제

  # ----------------------------------------------------
  # [Job 3] 도커 배달 (Push)
  # ----------------------------------------------------
  push:
    needs: build # 앞선 build가 성공해야만 실행됨!
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # 바톤 받기 (아까 올린 .jar 파일을 다운로드해서 특정 폴더에 쏙 넣음)
    - name: Download JAR artifact
      uses: actions/download-artifact@v4
      with:
        name: app-jar
        path: ./LibraryManagement_v1.2/build/libs/
        
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
        
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./LibraryManagement_v1.2
        file: ./LibraryManagement_v1.2/Dockerfile
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/library-app:latest
