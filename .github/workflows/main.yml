name: Java CI with Docker Hub

on:
  push:
    branches: [ "main" ]

jobs:
  # ----------------------------------------------------
  # [Job 1] 품질 검사대 (Test)
  # ----------------------------------------------------
  test:
    runs-on: ubuntu-latest
    
    # 🌟 깃허브 가상 컴퓨터에 띄울 1회용 깡통 DB 세팅
    services:
      mariadb:
        image: mariadb:latest
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: library
          MYSQL_USER: cjulib
          MYSQL_PASSWORD: security
        ports:
          - 3306:3306
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # 🌟 [핵심] 자바 테스트 전에 schema.sql을 DB에 밀어 넣어서 테이블 뚝딱 만들기!
    - name: Initialize Database with schema.sql
      working-directory: ./LibraryManagement_v1.2
      run: |
        mysql -h 127.0.0.1 -P 3306 -u cjulib -psecurity library < schema.sql
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Run Tests
      working-directory: ./LibraryManagement_v1.2
      run: |
        chmod +x gradlew
        ./gradlew test

  # ----------------------------------------------------
  # [Job 2] 포장 공장 (Build)
  # ----------------------------------------------------
  build:
    needs: test # 앞선 test가 성공해야만 실행됨!
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Build with Gradle
      working-directory: ./LibraryManagement_v1.2
      run: |
        chmod +x gradlew
        ./gradlew clean build -x test
        
    - name: Upload JAR artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-jar
        path: ./LibraryManagement_v1.2/build/libs/*.jar
        retention-days: 1

  # ----------------------------------------------------
  # [Job 3] 도커 배달 (Push)
  # ----------------------------------------------------
  push:
    needs: build # 앞선 build가 성공해야만 실행됨!
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download JAR artifact
      uses: actions/download-artifact@v4
      with:
        name: app-jar
        path: ./LibraryManagement_v1.2/build/libs/
        
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
        
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./LibraryManagement_v1.2
        file: ./LibraryManagement_v1.2/Dockerfile
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/library-app:latest
