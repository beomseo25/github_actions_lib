name: Java CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  # ----------------------------------------------------
  # [Job 1] 품질 검사대 (Test)
  # ----------------------------------------------------
  test:
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:latest
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: library
          MYSQL_USER: cjulib
          MYSQL_PASSWORD: security
        ports:
          - 3306:3306
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Initialize Database with schema.sql
      working-directory: ./LibraryManagement_v1.2
      run: |
        mysql -h 127.0.0.1 -P 3306 -u cjulib -psecurity library < schema.sql

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # 🌟 [핵심 변경] 자바에게 깃허브 가상 DB 주소(127.0.0.1)를 주입해 줍니다!
    - name: Run Tests
      working-directory: ./LibraryManagement_v1.2
      env:
        DB_URL: jdbc:mariadb://127.0.0.1:3306/library
        DB_USER: cjulib
        DB_PASSWORD: security
      run: |
        chmod +x gradlew
        ./gradlew test

  # ----------------------------------------------------
  # [Job 2] 포장 공장 (Build)
  # ----------------------------------------------------
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Build with Gradle
      working-directory: ./LibraryManagement_v1.2
      run: |
        chmod +x gradlew
        ./gradlew clean build -x test

    - name: Upload JAR artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-jar
        path: ./LibraryManagement_v1.2/build/libs/*.jar
        retention-days: 1

  # ----------------------------------------------------
  # [Job 3] 도커 배달 (Push)
  # ----------------------------------------------------
  push:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download JAR artifact
      uses: actions/download-artifact@v4
      with:
        name: app-jar
        path: ./LibraryManagement_v1.2/build/libs/

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./LibraryManagement_v1.2
        file: ./LibraryManagement_v1.2/Dockerfile
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/library-app:latest

  # ----------------------------------------------------
  # [Job 4] AWS EC2 자동 배포 (Deploy) 🚀 새로 추가!
  # ----------------------------------------------------
  deploy:
    needs: push  # 🌟 반드시 Job 3(push)이 완벽히 끝난 후에만 실행되도록 설정!
    runs-on: ubuntu-latest
    steps:
    - name: Deploy to AWS EC2
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        port: 22
        script: |
          # 1. AWS 서버의 도커 설계도가 있는 곳으로 이동 (아까 전송해둔 폴더)
          cd /home/ubuntu/
          
          # 2. 도커 허브에서 방금 완성된 최신 이미지를 다운로드
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/library-app:latest
          
          # 3. 기존에 켜져 있던 낡은 서버와 DB 컨테이너 종료
          docker compose down
          
          # 4. 방금 받은 최신 이미지로 서버와 DB 다시 시작 (-d: 백그라운드)
          docker compose up -d
          
          # 5. 하드디스크 용량 확보를 위해 안 쓰는 구버전 이미지 찌꺼기 싹 청소
          docker image prune -f
