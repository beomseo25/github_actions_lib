name: Java CI with Docker Hub

on:
  push:
    branches: [ "main" ] # 만약 깃허브 기본 브랜치가 master라면 "master"로 바꿔주세요!

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    # 1. 깃허브 저장소에서 코드 내려받기
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. [핵심 추가] 깡통 컴퓨터에 자바 17 설치하기
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # 3. [핵심 추가] 자바 프로그램 빌드해서 .jar 파일 만들기
    # 터미널 경로를 보니 프로젝트가 LibraryManagement_v1.2 폴더 안에 있는 것 같아 경로를 지정했습니다.
    - name: Build with Gradle
      working-directory: ./LibraryManagement_v1.2
      run: |
        chmod +x gradlew
        ./gradlew clean build -x test

    # 4. 도커허브 로그인
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # 5. 도커 이미지 굽고 푸시하기
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./LibraryManagement_v1.2
        file: ./LibraryManagement_v1.2/Dockerfile
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/library-app:latest
